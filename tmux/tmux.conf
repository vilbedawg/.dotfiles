set -a terminal-features "tmux-256color:RGB"
set -g prefix C-b
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g focus-events on
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=black bg=white"
set -g detach-on-destroy off

set -g status-interval 5
set -g status-left '#S'
set -g status-right '#[fg=white bold]%H:%M#[default]'

bind r source-file "~/.config/tmux/tmux.conf"
bind b set -g status
bind-key -n M-BSpace send-keys C-w
bind G neww -n "git" -S lazygit
bind f display-popup -B -E -w 50% -h 50% "~/.config/scripts/tmux-session-dispensary.sh"
bind n display-popup -B -E -w 20% -h 24% "~/.config/scripts/work-note.sh"
bind s display-popup -B -E -w 80% -h 80% "~/.config/scripts/tmux-session-picker.sh"
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r m resize-pane -Z

bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind -r H resize-pane -L 2

set -g mouse on
set -sg escape-time 0

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
